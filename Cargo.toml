[package]
name = "omelettehedron"
version = "0.1.0"
edition = "2021"
description = "Fast two-phase solver for the face-turning octahedron (FTO)"
license = "MIT"

[features]
# Use the portable scalar code instead of SIMD (to test that path on any machine).
scalar = []

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
rand = "0.8"
rand_xoshiro = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = 1

[profile.test]
opt-level = 3

[[bin]]
name = "omelettehedron"
path = "src/main.rs"

# The WebAssembly module (wasm/, see README.md "WebAssembly demo"). `cargo build`, `cargo test`
# and `cargo clippy` here still cover only this package.
[workspace]
members = [".", "wasm"]

# The WebAssembly module's build (scripts/build-wasm.sh): release without debug info, for a
# small `.wasm`.
[profile.wasm-release]
inherits = "release"
debug = 0
strip = true
