# Deploy the browser demo (wasm/) to GitHub Pages on every push to the default branch.
# The custom domain (omelettehedron.arhan.sh) is set in the repository's Pages settings; Pages
# source: GitHub Actions.
name: GitHub Pages

# Only pushes to main: a run from another branch would join the github-pages concurrency
# group and replace a deploy waiting there (it happened: a branch push cancelled the pending
# deploy of main 5cc3c89), even though its build job is then skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Install Rust WebAssembly targets
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-wasip1 wasm32-wasip1-threads
      - name: Build the browser demo
        run: scripts/build-pages.sh "${RUNNER_TEMP}/omelettehedron-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/omelettehedron-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
