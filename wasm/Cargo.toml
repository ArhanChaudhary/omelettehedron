[package]
name = "omelettehedron-wasm"
version = "0.1.0"
edition = "2021"
description = "omelettehedron as a WebAssembly module with a C ABI (see wasm/omelettehedron.mjs)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The threads build with 2 GiB of memory instead of 1 GiB, for the medium tables
# (omelettehedron-threads-medium.wasm, see build.rs and scripts/build-wasm.sh).
medium = []

[dependencies]
omelettehedron = { path = ".." }
rayon = "1"
serde_json = "1"
